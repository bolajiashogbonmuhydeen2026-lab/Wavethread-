<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveThread Messenger</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-main: #0b141a;
      --header-bg: #202c33;
      --card-bg: #111b21;
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
      --msg-sent: #005c4b;
      --msg-received: #202c33;
      --accent: #00a884;
      --input-bg: #2a3942;
      --tab-active: #00a884;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-primary); display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    .app-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background-color: var(--bg-main); }

    /* Verification / Auth Screen */
    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
    .auth-card { background: var(--card-bg); padding: 30px 20px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); text-align: center; }
    .auth-card h2 { color: var(--accent); margin-bottom: 8px; font-size: 1.6rem; }
    .auth-card p { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-group label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--input-bg); background: var(--input-bg); color: var(--text-primary); font-size: 0.95rem; outline: none; }
    .auth-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    
    #otp-step { display: none; }

    /* Main App Interface */
    #main-screen { display: none; flex-direction: column; height: 100%; }

    /* Top Navigation / Status Header */
    .app-header { background: var(--header-bg); padding: 12px 16px 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .app-title { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    .user-profile-badge { font-size: 0.8rem; background: var(--input-bg); padding: 4px 10px; border-radius: 12px; color: var(--text-primary); }

    /* Nav Tabs (Chats / Status) */
    .nav-tabs { display: flex; border-bottom: 2px solid transparent; }
    .tab-btn { flex: 1; text-align: center; padding: 10px 0; font-weight: bold; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--tab-active); border-bottom-color: var(--tab-active); }

    /* Tab Panels */
    .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
    .tab-content.active { display: flex; }

    /* Chat Messages Area */
    .messages-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message-bubble { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 0.92rem; word-wrap: break-word; display: flex; flex-direction: column; position: relative; }
    .message-bubble.sent { align-self: flex-end; background-color: var(--msg-sent); border-top-right-radius: 0; }
    .message-bubble.received { align-self: flex-start; background-color: var(--msg-received); border-top-left-radius: 0; }
    .sender-info { font-size: 0.72rem; font-weight: bold; color: var(--accent); margin-bottom: 3px; display: flex; justify-content: space-between; gap: 8px; }
    .media-preview { max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 4px; object-fit: cover; }
    .msg-time { font-size: 0.65rem; color: var(--text-secondary); align-self: flex-end; margin-top: 4px; }

    /* WhatsApp Chat Input Bar */
    .chat-input-bar { background: var(--header-bg); padding: 10px; display: flex; align-items: center; gap: 8px; }
    .file-attach-btn { background: transparent; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-secondary); padding: 4px; }
    .chat-input-bar input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: var(--input-bg); color: var(--text-primary); font-size: 0.95rem; outline: none; }
    .send-btn { background: var(--accent); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #media-file-input { display: none; }

    /* Status Tab UI */
    .status-container { padding: 16px; overflow-y: auto; }
    .my-status-card { display: flex; align-items: center; gap: 14px; padding: 10px; background: var(--card-bg); border-radius: 8px; margin-bottom: 16px; }
    .status-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 1.2rem; }
    .status-text-info h4 { font-size: 0.95rem; }
    .status-text-info p { font-size: 0.78rem; color: var(--text-secondary); }
    .upload-status-btn { margin-left: auto; background: var(--input-bg); color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; border-radius: 16px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }

    .status-section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; font-weight: bold; }
    .status-feed { display: flex; flex-direction: column; gap: 10px; }
    .status-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--card-bg); border-radius: 8px; }
    .status-ring { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--accent); padding: 2px; }
    .status-ring-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--input-bg); display: flex; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Screen 1: Verification & Auth -->
    <div id="auth-screen">
      <div class="auth-card">
        <h2>WaveThread</h2>
        <p>Verify your phone number to launch chat</p>
        
        <!-- Step 1: Phone + Name -->
        <div id="verify-step">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="user-name" placeholder="e.g. Bolaji" autocomplete="off">
          </div>
          <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="user-phone" placeholder="+234 800 000 0000" autocomplete="off">
          </div>
          <button class="auth-btn" id="request-otp-btn">Send Verification Code</button>
        </div>

        <!-- Step 2: OTP Entry -->
        <div id="otp-step">
          <div class="input-group">
            <label>Enter 4-Digit OTP Code</label>
            <input type="text" id="otp-input" maxlength="4" placeholder="1 2 3 4" autocomplete="off" style="text-align: center; letter-spacing: 6px;">
          </div>
          <button class="auth-btn" id="verify-otp-btn">Verify & Continue</button>
        </div>
      </div>
    </div>

    <!-- Screen 2: WhatsApp Chat Interface -->
    <div id="main-screen">
      <div class="app-header">
        <div class="header-top">
          <span class="app-title">WaveThread</span>
          <span class="user-profile-badge" id="profile-display">Online</span>
        </div>
        <div class="nav-tabs">
          <div class="tab-btn active" id="tab-chats-btn">CHATS</div>
          <div class="tab-btn" id="tab-status-btn">STATUS</div>
        </div>
      </div>

      <!-- CHATS PANEL -->
      <div class="tab-content active" id="chats-panel">
        <div class="messages-area" id="messages-container"></div>

        <!-- Message & Media Input Bar -->
        <div class="chat-input-bar">
          <button class="file-attach-btn" id="attach-btn" title="Upload Image/Video">📎</button>
          <input type="file" id="media-file-input" accept="image/*,video/*">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
          <button class="send-btn" id="send-btn">➔</button>
        </div>
      </div>

      <!-- STATUS PANEL -->
      <div class="tab-content" id="status-panel">
        <div class="status-container">
          <div class="my-status-card">
            <div class="status-avatar" id="my-status-avatar">U</div>
            <div class="status-text-info">
              <h4>My Status</h4>
              <p id="status-time-sub">Tap to post status update</p>
            </div>
            <button class="upload-status-btn" id="post-status-trigger">+ Add Status</button>
          </div>

          <div class="status-section-title">Recent Updates</div>
          <div class="status-feed" id="status-feed-list">
            <p style="font-size: 0.85rem; color: var(--text-secondary);">No recent status updates from friends.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = { name: '', phone: '' };

    // Screen Elements
    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');
    const verifyStep = document.getElementById('verify-step');
    const otpStep = document.getElementById('otp-step');

    // Tab Buttons
    const tabChatsBtn = document.getElementById('tab-chats-btn');
    const tabStatusBtn = document.getElementById('tab-status-btn');
    const chatsPanel = document.getElementById('chats-panel');
    const statusPanel = document.getElementById('status-panel');

    // Controls
    const userNameInput = document.getElementById('user-name');
    const userPhoneInput = document.getElementById('user-phone');
    const requestOtpBtn = document.getElementById('request-otp-btn');
    const otpInput = document.getElementById('otp-input');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');

    const profileDisplay = document.getElementById('profile-display');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const attachBtn = document.getElementById('attach-btn');
    const mediaFileInput = document.getElementById('media-file-input');

    // 1. Verification Logic
    requestOtpBtn.addEventListener('click', () => {
      const name = userNameInput.value.trim();
      const phone = userPhoneInput.value.trim();
      if (!name || !phone) {
        alert('Please enter both your full name and phone number.');
        return;
      }
      currentUser.name = name;
      currentUser.phone = phone;
      verifyStep.style.display = 'none';
      otpStep.style.display = 'block';
    });

    verifyOtpBtn.addEventListener('click', () => {
      const code = otpInput.value.trim();
      if (code.length < 4) {
        alert('Please enter a valid 4-digit code.');
        return;
      }
      authScreen.style.display = 'none';
      mainScreen.style.display = 'flex';
      profileDisplay.textContent = `${currentUser.name} (${currentUser.phone})`;
      document.getElementById('my-status-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
    });

    // 2. Navigation Tabs
    tabChatsBtn.addEventListener('click', () => {
      tabChatsBtn.classList.add('active');
      tabStatusBtn.classList.remove('active');
      chatsPanel.classList.add('active');
      statusPanel.classList.remove('active');
    });

    tabStatusBtn.addEventListener('click', () => {
      tabStatusBtn.classList.add('active');
      tabChatsBtn.classList.remove('active');
      statusPanel.classList.add('active');
      chatsPanel.classList.remove('active');
    });

    // 3. Socket Messaging Logic
    socket.on('load_messages', (messages) => {
      messagesContainer.innerHTML = '';
      messages.forEach(renderMessage);
      scrollToBottom();
    });

    socket.on('receive_message', (data) => {
      renderMessage(data);
      scrollToBottom();
    });

    function sendMessage(fileUrl = null) {
      const text = messageInput.value.trim();
      if ((text || fileUrl) && currentUser.name) {
        socket.emit('send_message', {
          sender: currentUser.name,
          phone: currentUser.phone,
          message: text,
          fileUrl: fileUrl
        });
        messageInput.value = '';
      }
    }

    sendBtn.addEventListener('click', () => sendMessage());
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // 4. File Attachment Upload Logic
    attachBtn.addEventListener('click', () => mediaFileInput.click());

    mediaFileInput.addEventListener('change', async () => {
      const file = mediaFileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const data = await response.json();
        if (data.fileUrl) {
          sendMessage(data.fileUrl);
        }
      } catch (err) {
        alert('Failed to upload media. Please try again.');
      }
      mediaFileInput.value = '';
    });

    // Render Message Bubbles to Screen
    function renderMessage(data) {
      const isSent = data.sender === currentUser.name;
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isSent ? 'sent' : 'received'}`;

      const timeStr = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      let mediaHtml = '';
      if (data.fileUrl) {
        const ext = data.fileUrl.split('.').pop().toLowerCase();
        if (['mp4', 'webm', 'ogg'].includes(ext)) {
          mediaHtml = `<video src="${data.fileUrl}" controls class="media-preview"></video>`;
        } else {
          mediaHtml = `<img src="${data.fileUrl}" class="media-preview" alt="Uploaded media"/>`;
        }
      }

      bubble.innerHTML = `
        <div class="sender-info">
          <span>${isSent ? 'You' : escapeHtml(data.sender)}</span>
          <span style="font-weight: normal; opacity: 0.7;">${data.phone ? escapeHtml(data.phone) : ''}</span>
        </div>
        ${data.message ? `<div class="msg-text">${escapeHtml(data.message)}</div>` : ''}
        ${mediaHtml}
        <div class="msg-time">${timeStr}</div>
      `;

      messagesContainer.appendChild(bubble);
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    // Status Posting Placeholder
    document.getElementById('post-status-trigger').addEventListener('click', () => {
      const statusText = prompt('Type your status update:');
      if (statusText) {
        const feed = document.getElementById('status-feed-list');
        if (feed.querySelector('p')) feed.innerHTML = '';
        
        const item = document.createElement('div');
        item.className = 'status-item';
        item.innerHTML = `
          <div class="status-ring">
            <div class="status-ring-inner">${currentUser.name.charAt(0).toUpperCase()}</div>
          </div>
          <div>
            <h4 style="font-size:0.9rem;">${escapeHtml(currentUser.name)}</h4>
            <p style="font-size:0.8rem; color:var(--text-secondary);">${escapeHtml(statusText)}</p>
          </div>
        `;
        feed.prepend(item);
        document.getElementById('status-time-sub').textContent = 'Just now';
      }
    });
  </script>
</body>
  </html>
